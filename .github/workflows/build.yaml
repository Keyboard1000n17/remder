name: Build / Release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release after building"
        type: boolean
        default: false
      version:
        description: "Release tag (if releasing)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check release version
        if: ${{ inputs.release }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # if anyone wants to remove this if feel free or whatever
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "version must look like v1.2.3 (got: '$VERSION')"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --os="*" --cpu="*"

      - name: Build all targets
        run: bun run build.ts

      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: remder-linux-x64
          path: dist/remder-linux-x64
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: remder-linux-arm64
          path: dist/remder-linux-arm64
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: remder-darwin-arm64
          path: dist/remder-darwin-arm64
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: remder-darwin-x64
          path: dist/remder-darwin-x64
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: remder-windows-x64
          path: dist/remder-windows-x64.exe
          if-no-files-found: error

  release:
    needs: build
    if:
      ${{ github.event_name == 'workflow_dispatch' && inputs.release &&
      github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: remder-binaries
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
